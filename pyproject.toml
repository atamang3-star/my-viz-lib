[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "sleepviz-atamang"
version = "0.1.0"
description = "A tiny visualization helper for sleep-health data"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "atamang3" }]
keywords = ["visualization", "matplotlib", "sleep", "eda", "pandas"]
dependencies = [
    "pandas>=1.5",
    "matplotlib>=3.6",
    "numpy>=1.23",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/atamang3-star/my-viz-lib"

[tool.setuptools.packages.find]
where = ["src"]
